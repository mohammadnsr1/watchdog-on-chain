[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wdchain"
version = "0.1.0"
description = "Evidence commitment for WatchDog sessions: canonical chunks, keccak256 Merkle roots and proofs (OpenZeppelin MerkleProof compatible)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "eth-hash[pycryptodome]>=0.5",
    "eth-account>=0.11",
    "web3>=6.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
wdchain-commit-session = "wdchain.cli.commit_session:main"
wdchain-prove = "wdchain.cli.prove:main"
wdchain-verify = "wdchain.cli.verify:main"
wdchain-anchor-session = "wdchain.cli.anchor_session:main"
wdchain-verify-onchain = "wdchain.cli.verify_onchain:main"

[tool.setuptools.packages.find]
include = ["wdchain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Tests marked `chain` need a running anvil and a deployed registry, so they are skipped
# unless explicitly selected:  pytest -m chain
addopts = "-m 'not chain'"
markers = [
    "chain: requires a live chain (anvil) and a deployed EvidenceRegistry",
]
